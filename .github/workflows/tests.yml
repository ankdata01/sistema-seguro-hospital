name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Configure ephemeral test environment
        shell: bash
        run: |
          echo "DEMO_MODE=true" >> "$GITHUB_ENV"
          echo "DEMO_TOTP_VIEWER=false" >> "$GITHUB_ENV"
          echo "COOKIE_SECURE=false" >> "$GITHUB_ENV"
          echo "HTTPS_ONLY=false" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pytest -q
